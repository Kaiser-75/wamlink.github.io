<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="rgb(247, 251, 255)">
  <meta name="description" content="WAMLink: A Recurrent World Action Model for End to End Autonomous Driving. Research project website.">
  <meta name="author" content="Kaiser Hamid, Can Cui, Md Mostafijur Rahman, Nade Liang">
  <meta property="og:type" content="website">
  <meta property="og:title" content="WAMLink: A Recurrent World Action Model for End to End Autonomous Driving">
  <meta property="og:description" content="Research project website for WAMLink.">
  <meta property="og:image" content="https://kaiser-75.github.io/wamlink.github.io/static/images/wamlink-icon.png">
  <meta property="og:url" content="https://kaiser-75.github.io/wamlink.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="WAMLink: A Recurrent World Action Model for End to End Autonomous Driving">
  <meta name="twitter:description" content="Research project website for WAMLink.">
  <meta name="twitter:image" content="https://kaiser-75.github.io/wamlink.github.io/static/images/wamlink-icon.png">
  <title>WAMLink: A Recurrent World Action Model for End to End Autonomous Driving</title>
  <link rel="icon" type="image/x-icon" href="static/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="static/images/wamlink-icon.png">
  <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: rgb(18, 36, 62);
      --muted: rgb(97, 113, 138);
      --border: rgb(225, 233, 246);
      --blue: rgb(37, 99, 235);
      --cyan: rgb(7, 183, 201);
      --violet: rgb(118, 87, 222);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 21%, rgba(55, 201, 213, .12), transparent 30%),
        radial-gradient(circle at 88% 29%, rgba(100, 118, 244, .12), transparent 33%),
        linear-gradient(160deg, rgb(255, 255, 255) 0%, rgb(247, 250, 255) 54%, rgb(245, 249, 255) 100%);
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(rgba(84, 124, 187, .17) .65px, transparent .65px);
      background-size: 22px 22px;
      content: '';
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .3), transparent 65%);
      pointer-events: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 25px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-family: 'Manrope', Arial, sans-serif;
      font-size: 1.24rem;
      font-weight: 800;
      letter-spacing: -.045em;
    }

    .brand img {
      display: block;
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .brand-label {
      color: rgb(16, 42, 80);
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgb(216, 229, 244);
      border-radius: 100px;
      padding: 10px 15px;
      background: rgba(255, 255, 255, .8);
      color: rgb(71, 97, 127);
      font-size: .82rem;
      font-weight: 700;
      transition: border-color .2s, color .2s, transform .2s;
    }

    .header-link:hover,
    .header-link:focus-visible {
      border-color: rgb(139, 184, 232);
      color: rgb(23, 77, 155);
      transform: translateY(-1px);
    }

    .header-link svg {
      display: block;
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    main {
      display: grid;
      min-height: calc(100vh - 165px);
      place-items: center;
      padding: 25px 24px 62px;
    }

    .hero {
      position: relative;
      isolation: isolate;
      width: min(900px, 100%);
      overflow: hidden;
      border: 1px solid rgba(205, 222, 245, .88);
      border-radius: 32px;
      padding: 55px 55px 62px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 32px 100px rgba(54, 91, 145, .105), 0 8px 28px rgba(54, 91, 145, .04);
      text-align: center;
    }

    .hero::before {
      position: absolute;
      top: -250px;
      left: 50%;
      z-index: -1;
      width: 580px;
      height: 430px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(54, 188, 214, .12) 2%, rgba(93, 128, 255, .07) 50%, transparent 72%);
      content: '';
      transform: translateX(-50%);
      pointer-events: none;
    }

    .icon-frame {
      display: grid;
      width: 168px;
      height: 168px;
      place-items: center;
      margin: 0 auto 28px;
      border: 1px solid rgb(227, 237, 252);
      border-radius: 36px;
      background: linear-gradient(150deg, rgb(255, 255, 255), rgb(244, 249, 255));
      box-shadow: 0 15px 40px rgba(57, 112, 180, .09), inset 0 1px 0 rgb(255, 255, 255);
    }

    .icon-frame img {
      display: block;
      width: 143px;
      height: 143px;
      object-fit: contain;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: rgb(84, 112, 143);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 4px rgba(7, 183, 201, .12);
      content: '';
    }

    h1 {
      margin: 0;
      font-family: 'Manrope', Arial, sans-serif;
      font-weight: 800;
    }

    .wordmark {
      display: block;
      margin-bottom: 14px;
      font-size: clamp(3.5rem, 9vw, 6.25rem);
      line-height: 1.18;
      letter-spacing: -.075em;
    }

    .wordmark-text {
      display: inline-block;
      padding-right: .08em;
      background: linear-gradient(105deg, rgb(5, 188, 202) 5%, rgb(37, 99, 235) 44%, rgb(120, 80, 217) 76%, rgb(243, 156, 59) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .wordmark-colon {
      color: rgb(100, 120, 146);
      letter-spacing: -.07em;
    }

    .paper-title {
      display: block;
      max-width: 740px;
      margin: 0 auto;
      color: rgb(23, 43, 72);
      font-size: clamp(1.43rem, 3.1vw, 2.08rem);
      font-weight: 700;
      line-height: 1.42;
      letter-spacing: -.044em;
      text-wrap: balance;
    }

    .accent-line {
      width: 72px;
      height: 4px;
      margin: 32px auto 26px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
    }

    .authors-heading {
      margin: 0 0 9px;
      color: rgb(112, 129, 154);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .authors {
      max-width: 720px;
      margin: 0 auto;
      color: rgb(36, 60, 94);
      font-size: 1.14rem;
      font-weight: 700;
      line-height: 1.65;
    }

    .site-footer {
      padding: 0 24px 26px;
      color: rgb(129, 144, 164);
      font-size: .79rem;
      font-weight: 500;
      text-align: center;
    }

    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .45);
      outline-offset: 5px;
    }

    @media (max-width: 640px) {
      .site-header {
        width: calc(100% - 34px);
        padding: 17px 0;
      }

      .header-link {
        padding: 10px;
      }

      .header-link span {
        display: none;
      }

      main {
        min-height: calc(100svh - 130px);
        padding: 14px 16px 45px;
      }

      .hero {
        border-radius: 24px;
        padding: 42px 23px 51px;
      }

      .icon-frame {
        width: 136px;
        height: 136px;
        margin-bottom: 24px;
        border-radius: 30px;
      }

      .icon-frame img {
        width: 119px;
        height: 119px;
      }

      .eyebrow {
        font-size: .65rem;
        letter-spacing: .12em;
      }

      .wordmark {
        margin-bottom: 11px;
      }

      .paper-title {
        line-height: 1.5;
      }

      .accent-line {
        margin: 27px auto 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .header-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="WAMLink home">
      <img src="static/images/wamlink-icon.png" alt="" width="43" height="43">
      <span class="brand-label">WAMLink</span>
    </a>
    <a class="header-link" href="https://github.com/Kaiser-75/wamlink.github.io" target="_blank" rel="noopener noreferrer" aria-label="View repository on GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.53v-2.14c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 .17 2.16.75 3.23-.57.1-.72.4-1.22.73-1.5-2.47-.28-5.06-1.24-5.06-5.49 0-1.21.44-2.2 1.16-2.97-.11-.28-.5-1.41.11-2.94 0 0 .95-.3 3.05 1.13a10.63 10.63 0 0 1 5.56 0c2.1-1.43 3.04-1.13 3.04-1.13.61 1.53.23 2.66.12 2.94.73.77 1.15 1.76 1.15 2.97 0 4.26-2.6 5.2-5.08 5.48.41.35.78 1.02.78 2.07V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"/></svg>
      <span>GitHub Repository</span>
    </a>
  </header>

  <main>
    <section class="hero" aria-labelledby="project-title">
      <div class="icon-frame">
        <img src="static/images/wamlink-icon.png" alt="WAMLink autonomous driving project emblem" width="143" height="143">
      </div>
      <p class="eyebrow">Autonomous Driving Research</p>
      <h1 id="project-title">
        <span class="wordmark"><span class="wordmark-text">WAMLink</span><span class="wordmark-colon">:</span></span>
        <span class="paper-title">A Recurrent World Action Model for End to End Autonomous Driving</span>
      </h1>
      <div class="accent-line" aria-hidden="true"></div>
      <p class="authors-heading">Authors</p>
      <p class="authors">Kaiser Hamid, Can Cui, Md Mostafijur Rahman, Nade Liang</p>
    </section>
  </main>

  <footer class="site-footer">WAMLink · Research Project</footer>
</body>
</html>
