<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="rgb(255, 255, 255)">
  <meta name="description" content="WAMLink: A Recurrent World Action Model for End to End Autonomous Driving.">
  <meta name="author" content="Kaiser Hamid, Can Cui, Md Mostafijur Rahman, Nade Liang">
  <meta property="og:type" content="website">
  <meta property="og:title" content="WAMLink: A Recurrent World Action Model for End to End Autonomous Driving">
  <meta property="og:description" content="WAMLink research project page.">
  <meta property="og:image" content="https://kaiser-75.github.io/wamlink.github.io/static/images/wamlink-icon.png">
  <meta property="og:url" content="https://kaiser-75.github.io/wamlink.github.io/">
  <meta name="twitter:card" content="summary">
  <title>WAMLink: A Recurrent World Action Model for End to End Autonomous Driving</title>

  <link rel="icon" type="image/x-icon" href="static/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="static/images/wamlink-icon.png">
  <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: rgb(255, 255, 255);
      color: rgb(30, 41, 59);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;
      padding: 74px 0 0;
    }

    .project-header {
      text-align: center;
    }

    .paper-title {
      margin: 0 auto;
      max-width: 1050px;
      font-size: clamp(2rem, 3.65vw, 3.15rem);
      font-weight: 750;
      line-height: 1.27;
      letter-spacing: -0.035em;
    }

    .project-name {
      background: linear-gradient(
        100deg,
        rgb(0, 176, 193) 0%,
        rgb(29, 111, 225) 35%,
        rgb(104, 75, 217) 68%,
        rgb(227, 136, 64) 100%
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .authors {
      margin: 27px auto 0;
      color: rgb(56, 81, 118);
      font-size: clamp(1rem, 1.7vw, 1.22rem);
      font-weight: 500;
      line-height: 1.9;
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 36px);
        padding-top: 46px;
      }

      .paper-title {
        font-size: clamp(1.75rem, 7vw, 2.35rem);
        line-height: 1.3;
      }

      .authors {
        margin-top: 23px;
        line-height: 1.75;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="project-header">
      <h1 class="paper-title">
        <span class="project-name">WAMLink</span>: A Recurrent World Action Model for End to End Autonomous Driving
      </h1>
      <p class="authors">
        Kaiser Hamid, Can Cui, Md Mostafijur Rahman, Nade Liang
      </p>
    </header>
  </main>
</body>
</html>
